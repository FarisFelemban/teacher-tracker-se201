<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
 <head th:replace="~{fragments :: head('Request could not be completed')}">
 </head>
 <body>
  <main class="narrow">
   <h1>
    Request could not be completed
   </h1>
   <p th:if="${status == 403}">
    You do not have permission for this action, or the form session expired.
   </p>
   <p th:if="${status == 404}">
    The page or record was not found.
   </p>
   <p th:if="${status != 403 and status != 404}">
    Please check your input and try again. If this continues, check the local application.
   </p>
   <a th:href="@{/home}">
    Return to my home page
   </a>
  </main>
 </body>
</html>
